repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
        name: check-yaml (tool configs)
        files: ^(\.clang-tidy|\.clangd|.*/\.clang-tidy)$
        types: [file]
      - id: check-added-large-files
      - id: mixed-line-ending
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v18.1.8
    hooks:
      - id: clang-format
        types_or: [c++, c]
  - repo: local
    hooks:
      - id: clang-tidy
        name: clang-tidy
        entry: clang-tidy-18 -p build -quiet
        language: system
        files: ^(sensor-node|stats|collector)/.*\.cpp$
